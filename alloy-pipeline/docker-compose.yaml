services:
  # -------------------------------------
  # APP LAYER
  # -------------------------------------
  producer-a:
    build:
      context: ./producer
    container_name: producer-a
    ports:
      - "8081:8080"
    environment:
      - OTEL_SERVICE_NAME=producer-a
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy-edge:4317
      - DOWNSTREAM_URLS=http://producer-b:8080
      - ERROR_RATE=5
      - SLOW_RATE=10
    networks:
      - app-net

  producer-b:
    build:
      context: ./producer
    container_name: producer-b
    ports:
      - "8082:8080"
    environment:
      - OTEL_SERVICE_NAME=producer-b
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy-edge:4317
      - TRAFFIC_GEN_ENABLED=false # B only reacts to A
    networks:
      - app-net

  alloy-edge:
    build:
      context: ./alloy-edge
    container_name: alloy-edge
    networks:
      - app-net         # Receives from producers
      - pipeline-net    # Sends to router
      - storage-net     # Sends metrics to VictoriaMetrics directly

  # -------------------------------------
  # PIPELINE LAYER
  # -------------------------------------
  alloy-router:
    build:
      context: ./alloy-router
    container_name: alloy-router
    depends_on:
      - alloy-edge
    networks:
      - pipeline-net    # Bridges edge and processors

  alloy-tail-sampling:
    build:
      context: ./alloy-tail-sampling
    container_name: alloy-tail-sampling
    depends_on:
      - tempo
    networks:
      - pipeline-net    # Receives from router
      - storage-net     # Sends to Tempo

  alloy-span-metrics:
    build:
      context: ./alloy-span-metrics
    container_name: alloy-span-metrics
    depends_on:
      - victoriametrics
    networks:
      - pipeline-net    # Receives from router
      - storage-net     # Sends to VictoriaMetrics

  alloy-grafana:
    build:
      context: ./alloy-grafana
    container_name: alloy-grafana
    depends_on:
      - loki
    networks:
      - pipeline-net    # Receives from router
      - storage-net     # Sends to Loki

  # -------------------------------------
  # STORAGE LAYER
  # -------------------------------------
  victoriametrics:
    build:
      context: ./victoriametrics
    container_name: victoriametrics
    ports:
      - "8428:8428"
    networks:
      - storage-net

  loki:
    build:
      context: ./loki
    container_name: loki
    ports:
      - "3100:3100"
    networks:
      - storage-net

  tempo:
    build:
      context: ./tempo
    container_name: tempo
    ports:
      - "3200:3200"
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks:
      - storage-net

  grafana:
    build:
      context: ./grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    depends_on:
      - victoriametrics
      - loki
      - tempo
    networks:
      - storage-net

networks:
  app-net:
    driver: bridge
  pipeline-net:
    driver: bridge
  storage-net:
    driver: bridge
